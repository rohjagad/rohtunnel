[project]
name = "rohtunnel"
version = "0.1.0"
description = "RohTunnel — VPN storefront and order automation for FN AutoSC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rohtunnel = "rohtunnel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rohtunnel*"]

[tool.ruff]
line-length = 100
target-version = "py311"
