name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m compileall -q rohtunnel tests

      - name: CLI smoke test
        run: |
          tmp="$(mktemp -d)"
          ROHTUNNEL_DB="$tmp/store.sqlite3" python -m rohtunnel initdb
          ROHTUNNEL_DB="$tmp/store.sqlite3" python -m rohtunnel migrate
          ROHTUNNEL_DB="$tmp/store.sqlite3" ROHTUNNEL_PANEL_TOKEN_FILE="$tmp/missing" \
            python -m rohtunnel doctor
          rm -rf "$tmp"
